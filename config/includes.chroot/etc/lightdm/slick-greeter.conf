#  إعدادات شاشة تسجيل الدخول (LightDM) — snlnOs
# ═══════════════════════════════════════════════
[Greeter]
background=/usr/share/backgrounds/snln/login-bg.png
theme-name=Materia-dark
icon-theme-name=Papirus-Dark
draw-user-backgrounds=false
xft-antialias=true
enable-hidpi=off
xft-dpi=96
font-name=Noto Sans 10
clock-format=%H:%M
logo=/usr/share/snln/logo/snln-logo.png
default-user-image=/usr/share/snln/logo/snln-logo.png
hide-user-image=false
show-hostname=false
show-power-button=true
show-a11y=true
