# ═══════════════════════════════════════════════
#  إعدادات محمّل الإقلاع GRUB لـ snlnOs
#  القائمة مخفية افتراضياً لتظهر شاشة الإقلاع فوراً.
#  لإظهار القائمة يدوياً: اضغط Shift (BIOS) أو Esc (UEFI) أثناء الإقلاع
# ═══════════════════════════════════════════════
GRUB_DISTRIBUTOR="snlnOS"
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=0
GRUB_THEME="/boot/grub/themes/snln/theme.txt"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
