# شاشة القفل — snlnOS
general {
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/backgrounds/snln/login-bg.png
    blur_passes = 2
}

label {
    monitor =
    text = $TIME
    color = rgb(219, 231, 245)
    font_size = 72
    font_family = Noto Sans
    position = 0, 140
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    outer_color = rgb(0, 160, 240)
    inner_color = rgb(10, 20, 40)
    font_color = rgb(219, 231, 245)
    placeholder_text = Password
    position = 0, -60
    halign = center
    valign = center
}
