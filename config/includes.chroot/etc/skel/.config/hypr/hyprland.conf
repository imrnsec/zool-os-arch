# ═══════════════════════════════════════════════
#  snlnOS — إعدادات Hyprland
#  اضغط SUPER+F1 لعرض كل الاختصارات
# ═══════════════════════════════════════════════

monitor = , preferred, auto, 1

$terminal = foot
$files    = thunar
$browser  = firefox-esr
$menu     = wofi --show drun

# ألوان الهوية (من شعار snlnOS)
$accent  = rgba(00a0f0ff)
$accent2 = rgba(4cc2ffff)
$inactive = rgba(1a2b4aaa)

# ── البرامج التي تبدأ مع الجلسة ──
exec-once = swaybg -i /usr/share/backgrounds/snln/wallpaper-snln.png -m fill
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = snln-blueman-launch
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch cliphist store
exec-once = sh -c 'sleep 4; notify-send -i /usr/share/snln/logo/snln-logo.png "مرحباً بك في snlnOS" "اضغط SUPER + F1 لعرض الاختصارات"'

# ── متغيرات البيئة ──
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb
env = XDG_SESSION_TYPE,wayland

# ── المظهر ──
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $inactive
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 6
        passes = 2
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000088)
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, ease, slide
    animation = border, 1, 10, default
    animation = fade, 1, 5, ease
    animation = workspaces, 1, 5, ease, slidefade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

# ── الإدخال: إنجليزي + عربي (Alt+Shift للتبديل) ──
input {
    kb_layout = us,ara
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# ── الاختصارات ──
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $files
bind = $mod, Space, exec, $menu
bind = $mod, W, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, J, togglesplit
bind = $mod, P, pseudo
bind = $mod, L, exec, hyprlock
bind = $mod, Escape, exec, snln-power
bind = $mod, F1, exec, snln-keys
bind = $mod, C, exec, sh -c 'cliphist list | wofi --dmenu | cliphist decode | wl-copy'
bind = $mod SHIFT, M, exit

bind = , Print, exec, snln-screenshot region
bind = SHIFT, Print, exec, snln-screenshot full

# التنقل بين النوافذ
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# مساحات العمل
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# تحريك/تغيير حجم النوافذ بالفأرة
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# الصوت والسطوع والوسائط
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
