# الخمول — Zool OS
# ٥ دقائق: قفل الشاشة  ·  ٢٠ دقيقة: سكون (لتوفير البطارية)
# عدّل القيم (بالثواني) كما تشاء، أو احذف listener السكون إن لم ترده.

general {
    lock_cmd = zool-idle lock
    before_sleep_cmd = zool-idle lock      # اقفل قبل السكون
    ignore_dbus_inhibit = false            # لا تقفل أثناء تشغيل فيديو
}

listener {
    timeout = 300
    on-timeout = zool-idle lock
}

listener {
    timeout = 1200
    on-timeout = zool-idle suspend
}
