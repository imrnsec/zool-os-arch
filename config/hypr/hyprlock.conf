# شاشة القفل والدخول — Zool OS  (اسم المستخدم + كلمة المرور)
general {
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/zool/themes/zool/backgrounds/1-nile-sunset.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.8
}

image {
    monitor =
    path = /usr/share/zool/logo/zool-logo-128.png
    size = 90
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(243, 230, 204)
    font_size = 60
    font_family = IBM Plex Sans Arabic
    position = 0, 140
    halign = center
    valign = center
}

# ── اسم المستخدم ──
shape {
    monitor =
    size = 300, 52
    rounding = 26
    color = rgba(23, 34, 41, 0.9)
    border_size = 2
    border_color = rgba(185, 169, 138, 0.6)
    position = 0, 25
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = <span font_family="JetBrainsMono Nerd Font" foreground="##e8b04a"></span>   $USER
    color = rgb(243, 230, 204)
    font_size = 14
    font_family = IBM Plex Sans Arabic
    position = 0, 25
    halign = center
    valign = center
    zindex = 1
}

# ── كلمة المرور ──
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    rounding = 26
    outer_color = rgb(232, 176, 74)
    inner_color = rgb(23, 34, 41)
    font_color = rgb(243, 230, 204)
    font_family = IBM Plex Sans Arabic
    check_color = rgb(59, 165, 160)
    fail_color = rgb(212, 106, 67)
    capslock_color = rgb(212, 106, 67)
    placeholder_text =   كلمة المرور · Password
    fail_text = كلمة المرور غير صحيحة ($ATTEMPTS)
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# ── تنبيه: يظهر فقط حين تكون لوحة المفاتيح عربية ──
label {
    monitor =
    text = $LAYOUT[!,⚠ لوحة المفاتيح عربية — اضغط Alt+Shift للتحويل إلى الإنجليزية]
    color = rgb(212, 106, 67)
    font_size = 13
    font_family = IBM Plex Sans Arabic
    position = 0, -105
    halign = center
    valign = center
}
