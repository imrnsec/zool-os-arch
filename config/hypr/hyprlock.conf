# شاشة القفل — Zool OS
general {
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/zool/wallpapers/nile-sunset.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.8
}

image {
    monitor =
    path = /usr/share/zool/logo/zool-logo-128.png
    size = 110
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(243, 230, 204)
    font_size = 72
    font_family = Noto Sans
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    rounding = 26
    outer_color = rgb(232, 176, 74)
    inner_color = rgb(23, 34, 41)
    font_color = rgb(243, 230, 204)
    placeholder_text = Password
    position = 0, -40
    halign = center
    valign = center
}
