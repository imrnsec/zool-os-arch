# Zool menu (SUPER+Z) — English labels. Same ids and commands as menu.conf.
#
#   المعرّف | العنوان | الأمر | شرط الظهور (اختياري)
#
# المعرّف المنقوط يحدد الشجرة: install.office.libreoffice يقع تحت install.office
# العنصر بلا أمر = قائمة فرعية.  لا تضع الرمز | داخل الأمر (ضع الأمر المركّب في سكربت).  الشرط أمر shell؛ إن فشل اختفى العنصر.
# لتخصيص القائمة انسخ هذا الملف إلى ~/.config/zool/menu.conf وعدّله.

apps | Apps | wofi --show drun

appearance | Appearance | 
appearance.theme | Theme | zool-theme
appearance.background | Background | zool-wallpaper pick
appearance.bg-next | Next background | zool-wallpaper next
appearance.effects | Effects: light ↔ full | zool-effects toggle

trigger | Tools | 
trigger.shot-region | Screenshot (region) | zool-screenshot region
trigger.shot-full | Screenshot (full screen) | zool-screenshot full
trigger.clipboard | Clipboard history | zool-clipboard
trigger.nightlight | Night light (toggle) | zool-nightlight toggle
trigger.monitor | System monitor | kitty -e btop

setup | Setup | 
setup.network | Network & Wi-Fi | kitty --title الشبكة -e nmtui
setup.bluetooth | Bluetooth | blueman-manager
setup.audio | Sound | pavucontrol
setup.prayer | Prayer times city | zool-prayer city
setup.timezone | Timezone | zool-timezone
setup.password | Password | zool-launch-terminal passwd
setup.language | Language / اللغة | zool-language
setup.power | Power | 
setup.power.saver | Power saver (longer battery) | powerprofilesctl set power-saver
setup.power.balanced | Balanced | powerprofilesctl set balanced
setup.power.performance | Performance | powerprofilesctl set performance
setup.printing | Set up printers | zool-launch-terminal zool-setup-printing

install | Install | 
install.zool | Zool to disk | zool-install | test -d /run/archiso
install.package | Package (Arch repos) | zool-launch-terminal zool-pkg-install
install.aur | Package from AUR | zool-launch-terminal zool-pkg-aur-install
install.theme | Theme from the internet | zool-launch-terminal zool-theme-install
install.webapp | Web app (site as an app) | zool-launch-terminal zool-webapp-install
install.office | Office | 
install.office.libreoffice | LibreOffice | zool-launch-terminal zool-pkg-add libreoffice-fresh libreoffice-fresh-ar
install.office.thunderbird | Thunderbird (mail) | zool-launch-terminal zool-pkg-add thunderbird thunderbird-i18n-ar
install.browser | Browser | 
install.browser.chromium | Chromium | zool-launch-terminal zool-pkg-add chromium
install.media | Media | 
install.media.vlc | VLC | zool-launch-terminal zool-pkg-add vlc
install.media.obs | OBS Studio (screen recording) | zool-launch-terminal zool-pkg-add obs-studio
install.media.gimp | GIMP (image editing) | zool-launch-terminal zool-pkg-add gimp
install.dev | Development | 
install.dev.code | VS Code (OSS) | zool-launch-terminal zool-pkg-add code
install.dev.docker | Docker | zool-launch-terminal zool-pkg-add docker docker-compose
install.dev.node | Node.js | zool-launch-terminal zool-pkg-add nodejs npm
install.dev.python | Python pip | zool-launch-terminal zool-pkg-add python-pip
install.chat | Chat | 
install.chat.telegram | Telegram | zool-launch-terminal zool-pkg-add telegram-desktop

remove | Remove | 
remove.package | Package | zool-launch-terminal zool-pkg-remove
remove.theme | Theme | zool-launch-terminal zool-theme-remove
remove.webapp | Web app | zool-launch-terminal zool-webapp-remove

update | Update | 
update.all | Zool and system packages | zool-launch-terminal zool-update | test ! -d /run/archiso
update.zool | Zool files only | zool-launch-terminal zool-update --zool | test ! -d /run/archiso
update.live | (works after installing to disk) | true | test -d /run/archiso

learn | Learn | 
learn.keys | Keybindings | zool-keys
learn.welcome | Welcome screen | zool-welcome
learn.arch | Arch Wiki | xdg-open https://wiki.archlinux.org
learn.hyprland | Hyprland Wiki | xdg-open https://wiki.hypr.land

about | About | zool-launch-terminal fastfetch
system | System | zool-power
