# قائمة زول (SUPER+Z) — على نمط قائمة Omarchy
#
#   المعرّف | العنوان | الأمر | شرط الظهور (اختياري)
#
# المعرّف المنقوط يحدد الشجرة: install.office.libreoffice يقع تحت install.office
# العنصر بلا أمر = قائمة فرعية.  لا تضع الرمز | داخل الأمر (ضع الأمر المركّب في سكربت).  الشرط أمر shell؛ إن فشل اختفى العنصر.
# لتخصيص القائمة انسخ هذا الملف إلى ~/.config/zool/menu.conf وعدّله.

apps | التطبيقات | wofi --show drun

appearance | المظهر |
appearance.theme | الثيم | zool-theme
appearance.background | الخلفية | zool-wallpaper pick
appearance.bg-next | الخلفية التالية | zool-wallpaper next
appearance.effects | المؤثرات: خفيف ↔ كامل | zool-effects toggle

trigger | أدوات |
trigger.shot-region | لقطة لجزء من الشاشة | zool-screenshot region
trigger.shot-full | لقطة للشاشة كاملة | zool-screenshot full
trigger.clipboard | سجل الحافظة | zool-clipboard
trigger.nightlight | الضوء الليلي (تشغيل/إيقاف) | zool-nightlight toggle
trigger.monitor | مراقب النظام | kitty -e btop

setup | الإعداد |
setup.network | الشبكة والواي فاي | kitty --title الشبكة -e nmtui
setup.bluetooth | البلوتوث | blueman-manager
setup.audio | الصوت | pavucontrol
setup.prayer | مدينة أوقات الصلاة | zool-prayer city
setup.timezone | المنطقة الزمنية | zool-timezone
setup.password | كلمة المرور | zool-launch-terminal passwd
setup.language | اللغة / Language | zool-language
setup.power | الطاقة |
setup.power.saver | توفير الطاقة (بطارية أطول) | powerprofilesctl set power-saver
setup.power.balanced | متوازن | powerprofilesctl set balanced
setup.power.performance | أداء عالٍ | powerprofilesctl set performance
setup.printing | إعداد الطابعات | zool-launch-terminal zool-setup-printing

install | تثبيت |
install.zool | زول على القرص | zool-install | test -d /run/archiso
install.package | حزمة من مستودعات Arch | zool-launch-terminal zool-pkg-install
install.aur | حزمة من AUR | zool-launch-terminal zool-pkg-aur-install
install.theme | ثيم من الإنترنت | zool-launch-terminal zool-theme-install
install.webapp | تطبيق ويب (موقع كتطبيق) | zool-launch-terminal zool-webapp-install
install.office | مكتب |
install.office.libreoffice | LibreOffice | zool-launch-terminal zool-pkg-add libreoffice-fresh libreoffice-fresh-ar
install.office.thunderbird | Thunderbird (بريد) | zool-launch-terminal zool-pkg-add thunderbird thunderbird-i18n-ar
install.browser | متصفح |
install.browser.chromium | Chromium | zool-launch-terminal zool-pkg-add chromium
install.media | وسائط |
install.media.vlc | VLC | zool-launch-terminal zool-pkg-add vlc
install.media.obs | OBS Studio (تسجيل الشاشة) | zool-launch-terminal zool-pkg-add obs-studio
install.media.gimp | GIMP (تحرير الصور) | zool-launch-terminal zool-pkg-add gimp
install.dev | تطوير |
install.dev.code | VS Code (OSS) | zool-launch-terminal zool-pkg-add code
install.dev.docker | Docker | zool-launch-terminal zool-pkg-add docker docker-compose
install.dev.node | Node.js | zool-launch-terminal zool-pkg-add nodejs npm
install.dev.python | Python pip | zool-launch-terminal zool-pkg-add python-pip
install.chat | تواصل |
install.chat.telegram | Telegram | zool-launch-terminal zool-pkg-add telegram-desktop

remove | إزالة |
remove.package | حزمة | zool-launch-terminal zool-pkg-remove
remove.theme | ثيم | zool-launch-terminal zool-theme-remove
remove.webapp | تطبيق ويب | zool-launch-terminal zool-webapp-remove

update | تحديث |
update.all | زول وحزم النظام | zool-launch-terminal zool-update | test ! -d /run/archiso
update.zool | ملفات زول فقط | zool-launch-terminal zool-update --zool | test ! -d /run/archiso
update.live | (يعمل بعد التثبيت على القرص) | true | test -d /run/archiso

learn | تعلّم |
learn.keys | الاختصارات | zool-keys
learn.welcome | شاشة الترحيب | zool-welcome
learn.arch | ويكي Arch | xdg-open https://wiki.archlinux.org
learn.hyprland | ويكي Hyprland | xdg-open https://wiki.hypr.land

about | عن النظام | zool-launch-terminal fastfetch
system | النظام | zool-power
