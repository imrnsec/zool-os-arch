<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="disc" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#26394a"/>
      <stop offset="1" stop-color="#0f171f"/>
    </radialGradient>
    <linearGradient id="river" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f4cf7d"/>
      <stop offset="0.45" stop-color="#8fd3c5"/>
      <stop offset="1" stop-color="#2f9c9a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4cf7d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f4cf7d" stop-opacity="0"/>
    </radialGradient>
    <polygon id="tri" points="256,14 268,44 244,44"/>
  </defs>

  <!-- قرص الخلفية -->
  <circle cx="256" cy="256" r="246" fill="url(#disc)"/>

  <!-- حلقة المثلثات النوبية -->
  <g id="ring">
    <g fill="#f0dcb0">
      <use href="#tri"/>
      <use href="#tri" transform="rotate(30 256 256)"/>
      <use href="#tri" transform="rotate(60 256 256)"/>
      <use href="#tri" transform="rotate(90 256 256)"/>
      <use href="#tri" transform="rotate(120 256 256)"/>
      <use href="#tri" transform="rotate(150 256 256)"/>
      <use href="#tri" transform="rotate(180 256 256)"/>
      <use href="#tri" transform="rotate(210 256 256)"/>
      <use href="#tri" transform="rotate(240 256 256)"/>
      <use href="#tri" transform="rotate(270 256 256)"/>
      <use href="#tri" transform="rotate(300 256 256)"/>
      <use href="#tri" transform="rotate(330 256 256)"/>
    </g>
    <g fill="#c9623f">
      <use href="#tri" transform="rotate(15 256 256)"/>
      <use href="#tri" transform="rotate(45 256 256)"/>
      <use href="#tri" transform="rotate(75 256 256)"/>
      <use href="#tri" transform="rotate(105 256 256)"/>
      <use href="#tri" transform="rotate(135 256 256)"/>
      <use href="#tri" transform="rotate(165 256 256)"/>
      <use href="#tri" transform="rotate(195 256 256)"/>
      <use href="#tri" transform="rotate(225 256 256)"/>
      <use href="#tri" transform="rotate(255 256 256)"/>
      <use href="#tri" transform="rotate(285 256 256)"/>
      <use href="#tri" transform="rotate(315 256 256)"/>
      <use href="#tri" transform="rotate(345 256 256)"/>
    </g>
  </g>

  <circle cx="256" cy="256" r="204" fill="none" stroke="#e0a94a" stroke-width="3" opacity="0.8"/>

  <!-- الشمس -->
  <circle cx="256" cy="116" r="40" fill="url(#glow)"/>
  <circle cx="256" cy="116" r="13" fill="#f4cf7d"/>

  <!-- حرف Z على هيئة نهر النيل -->
  <path d="M148 172 H364 C298 222 214 294 148 346 H364"
        fill="none" stroke="url(#river)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- موجتان صغيرتان -->
  <path d="M206 396 q12 -14 25 0 t25 0 t25 0 t25 0" fill="none" stroke="#7cc8bd" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
</svg>
