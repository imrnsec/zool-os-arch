<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Zool OS: ترتيب الخطوط العربية. الواجهة: IBM Plex Sans Arabic · العناوين: Reem Kufi · النص الأدبي: Amiri -->
<fontconfig>
  <alias binding="same"><family>sans-serif</family>
    <prefer><family>IBM Plex Sans Arabic</family><family>Noto Sans</family><family>Noto Sans Arabic</family></prefer></alias>
  <alias binding="same"><family>serif</family>
    <prefer><family>Noto Serif</family><family>Amiri</family><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family><family>IBM Plex Sans Arabic</family><family>Noto Sans Arabic</family></prefer></alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>IBM Plex Sans Arabic</string></edit>
  </match>
</fontconfig>
