# ═══════════════════════════════════════════════
#  قائمة GRUB لـ Zool OS — بثيم YoRHa
#  الثيم يُنزَّل وقت البناء إلى boot/grub/themes/yorha (انظر tools/fetch-grub-theme.sh)
# ═══════════════════════════════════════════════

# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Graphics + theme support
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg
set gfxmode=auto
set gfxpayload=keep
loadfont "${prefix}/fonts/unicode.pf2"
terminal_input console
terminal_output gfxterm

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Get the lowercase UEFI machine type short-name to use for architecture-specific tools
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    fi
fi

# ── ثيم YoRHa (إن لم يوجد يبقى GRUB بالثيم الافتراضي) ──
if [ -f "(${root})/boot/grub/themes/yorha/theme.txt" ]; then
    for font in "(${root})/boot/grub/themes/yorha/"*.pf2; do
        loadfont "${font}"
    done
    set theme="(${root})/boot/grub/themes/yorha/theme.txt"
fi

set default=zoolos
set timeout=10
set timeout_style=menu

# Menu entries

menuentry "Zool OS (%ARCH%, ${archiso_platform})" --class zool --class arch --class gnu-linux --class os --id 'zoolos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Zool OS - safe graphics (nomodeset)" --class zool --class os --id 'zoolos-safe' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a -f "/boot/memtest86+/memtest86${uefi_machine_type_lower}.efi" ]; then
    menuentry 'Memtest86+' --class memtest86 --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest86${uefi_machine_type_lower}.efi
    }
elif [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Memtest86+' --class memtest86 --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ -f "/shell${uefi_machine_type_lower}.efi" ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shell${uefi_machine_type_lower}.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Shutdown' --class shutdown --class poweroff {
    halt
}

menuentry 'Restart' --class reboot --class restart {
    reboot
}
